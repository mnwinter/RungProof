[preset.0]

name="Windows Offline Demo"
platform="Windows Desktop"
runnable=true
custom_features="offline_demo"
export_filter="all_resources"
include_filter="*.json,*.md"
exclude_filter="tests/*,tools/*,artifacts/*,*/source/*,*/review/*,*.blend,*.blend1,*.ps1,*.py,*.csproj,*.sln,*.slnx"
export_path="artifacts/offline-demo/RungProof.exe"

[preset.0.options]

custom_template/debug=".tools/export-templates/windows/windows_debug_x86_64.exe"
custom_template/release=".tools/export-templates/windows/windows_release_x86_64.exe"
debug/export_console_wrapper=2
binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/modify_resources=false
codesign/enable=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
